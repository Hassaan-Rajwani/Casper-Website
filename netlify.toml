[build]
  command = "npm ci --include=optional && npm run build"
  publish = ".next"

[[plugins]]
  package = "@netlify/plugin-nextjs"

[build.environment]
  NODE_VERSION = "22"
  NPM_FLAGS = "--include=optional"
  # Server env vars are inlined into Next.js server bundles during build.
  SECRETS_SCAN_OMIT_KEYS = "NEXT_PUBLIC_FIREBASE_API_KEY,NEXT_PUBLIC_FIREBASE_APP_ID,NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN,NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID,NEXT_PUBLIC_FIREBASE_PROJECT_ID,NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET,NEXT_PUBLIC_TAWK_PROPERTY_ID,NEXT_PUBLIC_TAWK_WIDGET_ID,NEXT_PUBLIC_CONTACT_EMAIL,NEXT_PUBLIC_ORDER_NOTIFICATION_EMAIL,NEXT_PUBLIC_SITE_URL,ORDER_NOTIFICATION_EMAIL,MAIL_FROM,SMTP_HOST,SMTP_PORT,SMTP_USER,SMTP_PASS,RESEND_API_KEY,FIREBASE_SERVICE_ACCOUNT_JSON,FIREBASE_SERVICE_ACCOUNT_JSON_BASE64,VITE_FIREBASE_API_KEY,VITE_FIREBASE_APP_ID,VITE_FIREBASE_AUTH_DOMAIN,VITE_FIREBASE_MESSAGING_SENDER_ID,VITE_FIREBASE_PROJECT_ID,VITE_FIREBASE_STORAGE_BUCKET"
  SECRETS_SCAN_OMIT_PATHS = ".next/**,.netlify/**"
